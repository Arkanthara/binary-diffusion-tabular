dataset_name: heloc          # one of: travel | sick | heloc | adult | diabetes | california
path_test: ./data/heloc_test.csv  

path_synthetic_trains:
  - test/samples_3.csv                 # 5 synthetic CSV files generated by Binary Diffusion
  # - ./outputs/heloc/samples_1.csv               # (each was produced from the 80% training split)
  # - ./outputs/adult/samples_2.csv
  # - ./outputs/adult/samples_3.csv
  # - ./outputs/adult/samples_4.csv
  # - ./outputs/adult/samples_5.csv

data:                                   # dataset parameters
  path_table: ./data/heloc_train.csv    # path to dataset in csv format
  numerical_columns:                    # list of numerical columns
    - ExternalRiskEstimate
    - MSinceOldestTradeOpen
    - MSinceMostRecentTradeOpen
    - AverageMInFile
    - NumSatisfactoryTrades
    - NumTrades60Ever2DerogPubRec
    - NumTrades90Ever2DerogPubRec
    - PercentTradesNeverDelq
    - MSinceMostRecentDelq
    - MaxDelq2PublicRecLast12M
    - MaxDelqEver
    - NumTotalTrades
    - NumTradesOpeninLast12M
    - PercentInstallTrades
    - MSinceMostRecentInqexcl7days
    - NumInqLast6M
    - NumInqLast6Mexcl7days
    - NetFractionRevolvingBurden
    - NetFractionInstallBurden
    - NumRevolvingTradesWBalance
    - NumInstallTradesWBalance
    - NumBank2NatlTradesWHighUtilization
    - PercentTradesWBalance
  categorical_columns:                  # list of categorical columns
    - RiskPerformance
  columns_to_drop:                      # list of columns to drop
  dropna: False                          # if True, rows with nan values are dropped
  fillna: True                         # if True, numerical nan values are replaced with mean, categorical are replaced with mode. Either dropna or fillna can be True
  target_column: RiskPerformance        # target column, if conditional generation. If None, unconditional generation
  split_feature_target: True            # should be True for conditional generation
  task: classification                  # table task, can be `classification` or `regression`
