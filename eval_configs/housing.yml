data:
  synthetic_train_paths:
    - ./data/synthetic/california_synth_1.csv
    - ./data/synthetic/california_synth_2.csv
    - ./data/synthetic/california_synth_3.csv
    - ./data/synthetic/california_synth_4.csv
    - ./data/synthetic/california_synth_5.csv
  test_path: ./data/california_test.csv
  numerical_columns:
    - MedInc
    - HouseAge
    - AveRooms
    - AveBedrms
    - Population
    - AveOccup
    - Latitude
    - Longitude
  categorical_columns: []
  columns_to_drop: []
  dropna: true
  target_column: MedHouseVal
  task: regression
models:
  LR:
    enabled: true
    params: {}   # LinearRegression has no max_iter
  DT:
    enabled: true
    params:
      max_depth: 10
  RF:
    enabled: true
    params:
      max_depth: 12
      n_estimators: 85
      n_jobs: -1
n_jobs: -1
