dataset_name: adult          # one of: travel | sick | heloc | adult | diabetes | california
path_test: ./data/adult_test.csv  

path_synthetic_trains:                    # 5 synthetic CSV files generated by Binary Diffusion
  # - ./outputs/adult/samples_1.csv               # (each was produced from the 80% training split)
  # - ./outputs/adult/samples_2.csv
  # - ./outputs/adult/samples_3.csv
  # - ./outputs/adult/samples_4.csv
  # - ./outputs/adult/samples_5.csv

data:                                        # dataset parameters
  path_table: ./data/adult_train.csv         # path to dataset in csv format
  numerical_columns:                         # list of numerical columns
    - age
    - fnlwgt
    - education-num
    - capital-gain
    - capital-loss
    - hours-per-week
  categorical_columns:                       # list of categorical columns
    - workclass
    - education
    - marital-status
    - occupation
    - relationship
    - race
    - sex
    - native-country
  columns_to_drop:                           # list of columns to drop
  dropna: False                               # if True, rows with nan values are dropped
  fillna: True                              # if True, numerical nan values are replaced with mean, categorical are replaced with mode. Either dropna or fillna can be True
  target_column: label                       # target column, if conditional generation. If None, unconditional generation
  split_feature_target: False                 # should be True for conditional generation
  task: classification                       # table task, can be `classification` or `regression`
