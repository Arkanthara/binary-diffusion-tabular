# ── Evaluation configuration ──────────────────────────────────────────────────
# Used by evaluate.py

dataset_name: diabetes          # one of: travel | sick | heloc | adult | diabetes | california
                                # controls which hyperparameters are used (see Table 2 in the paper)

path_test: ./data/diabetes_test.csv       # real test set (the 20% hold-out split)

path_synthetic_trains:                    # 5 synthetic CSV files generated by Binary Diffusion
  # - ./outputs/diabetes/samples_1.csv               # (each was produced from the 80% training split)
  - ./outputs/diabetes/samples_2.csv
  # - ./outputs/diabetes/samples_3.csv
  # - ./outputs/diabetes/samples_4.csv
  # - ./outputs/diabetes/samples_5.csv

data:                                     # dataset schema & preprocessing parameters
  path_table: ./data/diabetes_train.csv  # (informational – not loaded by evaluate.py)

  numerical_columns:
    - num_lab_procedures
    - num_procedures
    - num_medications
    - number_outpatient
    - number_emergency
    - number_inpatient
    - number_diagnoses
    - time_in_hospital

  categorical_columns:
    - race
    - gender
    - age
    # - weight
    - admission_type_id
    - discharge_disposition_id
    - admission_source_id
    # - payer_code
    - medical_specialty
    - diag_1
    - diag_2
    - diag_3
    - max_glu_serum
    - A1Cresult
    - metformin
    - repaglinide
    - nateglinide
    - chlorpropamide
    - glimepiride
    - acetohexamide
    - glipizide
    - glyburide
    - tolbutamide
    - pioglitazone
    - rosiglitazone
    - acarbose
    - miglitol
    - troglitazone
    - tolazamide
    - examide
    - citoglipton
    - insulin
    - glyburide-metformin
    - glipizide-metformin
    - glimepiride-pioglitazone
    - metformin-rosiglitazone
    - metformin-pioglitazone
    - change
    - diabetesMed

  columns_to_drop:               # columns to remove before any processing (e.g. IDs)
    - encounter_id
    - patient_nbr
    - weight
    - payer_code

  dropna: False                   # if True → drop rows with any NaN
  fillna: True                  # if True → fill NaN (mean for numerical, mode for categorical)
                                 # dropna and fillna are mutually exclusive

  target_column: readmitted      # supervised target; set to null for unconditional generation
  split_feature_target: True     # should be True for conditional generation
  task: classification           # 'classification' or 'regression'
